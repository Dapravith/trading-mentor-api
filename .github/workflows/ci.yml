name: Java CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify safe local startup preflight
        run: bash scripts/test-start-local.sh
      - name: Verify Telegram and Hermes local operational scripts
        run: |
          bash -n scripts/verify-telegram-delivery.sh
          bash -n scripts/install-hermes-news-local.sh
          bash -n scripts/submit-hermes-news.sh
          bash scripts/test-telegram-verify.sh
      - name: Test cloud market monitor without network or secrets
        run: |
          python3 -m unittest discover -s scripts -p 'test-cloud-market-monitor.py' -v
          python3 -m py_compile scripts/cloud-market-monitor.py
      - name: Run tests
        run: ./gradlew --no-daemon clean test
