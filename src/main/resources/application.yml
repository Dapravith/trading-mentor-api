spring:
  application:
    name: ai-trading-mentor
  datasource:
    url: jdbc:h2:file:./data/trading-mentor;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
server:
  address: 127.0.0.1 # Intentionally unavailable outside the machine
  port: 8080
  error:
    include-message: never
trading:
  market-data-url: https://data-api.binance.vision
  allowed-symbols: BTCUSDT,ETHUSDT
  interval: 4h
  paper-balance-usdt: 1000
  candles-limit: 200
  max-clock-skew-seconds: 120
  risk-fraction: 0.005
  max-allocation: 0.20
  fee-per-side: 0.001
  slippage-per-side: 0.001
  scan:
    scheduling-enabled: ${MARKET_SCAN_ENABLED:false}
    interval-ms: 900000
    initial-delay-ms: 30000
  news:
    intake-enabled: ${HERMES_NEWS_INTAKE_ENABLED:false}
    ingest-key: ${HERMES_NEWS_INGEST_KEY:}
  alert:
    enabled: true
    delivery-enabled: ${TELEGRAM_DELIVERY_ENABLED:false}
    manual-retry-enabled: ${ALERT_MANUAL_RETRY_ENABLED:false}
    operator-key: ${ALERT_OPERATOR_KEY:}
    test-endpoint-enabled: ${TELEGRAM_TEST_ALERT_ENABLED:false}
    telegram-token: ${TELEGRAM_BOT_TOKEN:}
    telegram-chat-id: ${TELEGRAM_CHAT_ID:}
    max-attempts: 5
    dispatch-interval-ms: 60000
  telegram-commands:
    # Interactive bot commands over long polling; uses the same bot token.
    enabled: ${TELEGRAM_COMMANDS_ENABLED:false}
    allowed-user-ids: ${TELEGRAM_ALLOWED_USER_IDS:}
    poll-timeout-seconds: 25
  account:
    enabled: ${BINANCE_ACCOUNT_MONITOR_ENABLED:false}
    api-key: ${BINANCE_READ_API_KEY:}
    api-secret: ${BINANCE_READ_API_SECRET:}
    daily-enabled: ${BINANCE_ACCOUNT_DAILY_ENABLED:false}
    daily-cron: "0 0 9 * * *"
    daily-bot-token: ${TELEGRAM_BOT_TOKEN:}
    daily-private-chat-id: ${BINANCE_PRIVATE_CHAT_ID:}
logging:
  level:
    root: INFO
    kh.mentor.trading: INFO

